name: CI

# Cross-platform gates: the full suite + lint/format/type checks run on both
# Linux and Windows so Windows support is verified on a real Windows runner
# (not only mocked on Linux). CI runners have no real NIC/Npcap/root, so
# hardware- and privilege-dependent paths stay mocked in the tests; this proves
# the code imports, builds, and behaves correctly on Windows, not that live
# packet capture works there.

on:
  push:
    branches: [main, hakai-reliability]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen  # headless PySide6 — no display on CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # PySide6's offscreen platform plugin still needs a few system libs on
      # Linux runners; Windows wheels are self-contained.
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.2.0 ruff==0.17.6 mypy==2.4.1

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q
